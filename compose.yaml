services:
  rust:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
  backtest:
    build:
      context: .
      dockerfile: Dockerfile
      target: backtest
    working_dir: /app
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./strategy:/app/strategy:ro
      - ./backtest/data-sources.json:/app/backtest/data-sources.json:ro
      - ./data/histdata-eurusd-2023:/app/data/histdata-eurusd-2023:ro
      - ./data/histdata-eurusd-2024-2026:/app/data/histdata-eurusd-2024-2026:ro
      - ./data/histdata-gbpusd-2023-2026:/app/data/histdata-gbpusd-2023-2026:ro
      - ./data/histdata-usdjpy-2023-2026:/app/data/histdata-usdjpy-2023-2026:ro
      - ./reports/backtests:/app/reports/backtests
volumes:
  cargo-registry:
  cargo-target:
