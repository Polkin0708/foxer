[package]
license.workspace = true
name = "forex-backtest"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
[dependencies]
forex-core = { path = "../core" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
chrono = { version = "=0.4.40", default-features = false, features = ["std"] }
csv = "=1.3.1"
sha2 = "=0.10.8"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
